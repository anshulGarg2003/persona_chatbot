services:
  backend:
    build:
      context: ./backend
      args:
        PIP_DEFAULT_TIMEOUT: "120"
        PIP_RETRIES: "10"
    container_name: persona_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env

  frontend:
    image: node:20-alpine
    container_name: persona_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]
